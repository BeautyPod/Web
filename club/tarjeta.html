<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu tarjeta | Club BeautyPod</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#272727">
  <link rel="icon" type="image/svg+xml" href="../assets/img/beautypod-logo.svg">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preload" href="../assets/fonts/inter-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/cardo-v21-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .loyalty-wrap { max-width: 440px; margin-inline: auto; }
    #card { min-height: 28rem; } /* reserva espacio para que la página no salte al cargar la tarjeta */
    .loyalty-card { position: relative; overflow: hidden; isolation: isolate; padding: var(--space-4);
      background: radial-gradient(120% 80% at 100% 0%, rgba(96,165,250,.18), transparent 55%), linear-gradient(160deg, #2a3445 0%, #1f2733 60%, #1a2029 100%);
      border: 1px solid rgba(147,197,253,.35); border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 36px rgba(96,165,250,.14), inset 0 1px 0 rgba(255,255,255,.08); }
    .loyalty-card::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.13) 50%, transparent 60%);
      transform: translateX(-120%); animation: lc-shimmer 6s ease-in-out infinite; }
    .loyalty-card > *:not(.spark) { position: relative; z-index: 2; }
    .spark { position: absolute; z-index: 3; left: var(--x); top: var(--y); width: var(--s, 10px); height: var(--s, 10px); background: var(--c, #fff);
      clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
      opacity: 0; pointer-events: none; animation: lc-twinkle 3.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .loyalty-card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding-bottom: var(--space-3); margin-bottom: var(--space-3); border-bottom: 1px solid rgba(147,197,253,.22); }
    .loyalty-card__brand { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700; line-height: 1.1; margin: 0; }
    .loyalty-card__sub { display: block; font-family: var(--font-body); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); font-weight: 600; margin-top: .25rem; }
    .loyalty-card__shield { color: var(--color-accent); }
    .loyalty-card__shield .icon { width: 26px; height: 26px; }
    .loyalty-card__eyebrow { display: block; color: var(--color-accent); font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: var(--space-1); }
    .loyalty-card__title { font-size: 1.5rem; font-weight: 700; margin-bottom: var(--space-3); }
    .lc-stars { display: flex; justify-content: space-between; gap: var(--space-1); margin-bottom: var(--space-4); list-style: none; padding: 0; }
    .lc-star { display: flex; flex-direction: column; align-items: center; gap: .4rem; font-size: .75rem; color: var(--color-text-muted); }
    .lc-star__dot { width: clamp(42px, 12vw, 54px); height: clamp(42px, 12vw, 54px); display: flex; align-items: center; justify-content: center; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: #8b97a8; }
    .lc-star__dot .icon { width: 46%; height: 46%; }
    .lc-star.is-earned .lc-star__dot { background: radial-gradient(circle at 35% 30%, #bfdbfe, var(--color-accent) 70%); border-color: var(--color-accent-hover); color: var(--color-on-accent);
      box-shadow: 0 0 0 0 rgba(147,197,253,.5), 0 0 16px rgba(96,165,250,.45); animation: lc-glow 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .lc-star.is-earned .lc-star__dot .icon { fill: currentColor; }
    .lc-star.is-earned { color: var(--color-text-soft); }
    .lc-progress__row { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-small); margin-bottom: .5rem; }
    .lc-progress__row strong { font-size: 1.05rem; }
    .lc-progress__track { height: 10px; border-radius: var(--radius-pill); background: rgba(255,255,255,.1); overflow: hidden; }
    .lc-progress__fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--color-accent), var(--color-accent-hover), var(--color-accent));
      background-size: 200% 100%; animation: lc-flow 4s linear infinite; transition: width .6s ease; }
    .lc-reward { display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-4); padding: var(--space-3); background: rgba(255,255,255,.06); border: 1px solid var(--color-border); border-radius: var(--radius); }
    .lc-reward__icon { color: #f4d58d; }
    .lc-reward h3 { font-size: 1rem; font-weight: 800; margin-bottom: .25rem; }
    .lc-reward p { margin: 0; font-size: var(--fs-small); color: var(--color-text-soft); }
    .loyalty-caption { text-align: center; margin: var(--space-3) 0 0; font-size: var(--fs-small); color: var(--color-text-muted); }
    .loyalty-caption a { color: var(--color-accent); }

    /* Lista de clientas del Club (debajo de la tarjeta) */
    .club-list { margin-top: var(--space-4); padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); background: rgba(255,255,255,.04); }
    .club-list h2 { font-size: 1.1rem; margin: 0 0 .2rem; }
    .club-list__sub { margin: 0 0 .8rem; font-size: var(--fs-small); color: var(--color-text-muted); }
    .club-list ul { list-style: none; margin: 0; padding: 0; max-height: 22rem; overflow-y: auto; }
    .club-list li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .55rem .7rem; border-radius: 12px; }
    .club-list li + li { margin-top: .25rem; }
    .club-list li.me { background: rgba(96,165,250,.18); outline: 1px solid var(--color-accent); font-weight: 700; }
    .club-st { color: var(--color-accent); letter-spacing: .06em; white-space: nowrap; font-size: .85rem; }

    @keyframes lc-shimmer { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
    @keyframes lc-twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 50% { opacity: .95; transform: scale(1) rotate(45deg); } }
    @keyframes lc-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(147,197,253,.45), 0 0 14px rgba(96,165,250,.4); } 50% { box-shadow: 0 0 0 6px rgba(147,197,253,0), 0 0 24px rgba(147,197,253,.65); } }
    @keyframes lc-flow { from { background-position: 0% 0; } to { background-position: 200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .loyalty-card::after, .lc-progress__fill, .lc-star.is-earned .lc-star__dot { animation: none !important; }
      .spark { animation: none !important; opacity: .6; transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
  <header class="site-header" id="site-header"></header>

  <main id="contenido" tabindex="-1">
    <section class="section section--soft" aria-labelledby="tarjeta-title">
      <div class="container">
        <div class="section__heading">
          <h1 id="tarjeta-title">Tu tarjeta del Club</h1>
          <p>Cada visita válida suma una estrella.</p>
        </div>
        <div class="loyalty-wrap" id="card" aria-live="polite"></div>

        <!-- Clientas del Club: se muestra debajo de la tarjeta -->
        <section class="loyalty-wrap club-list" id="clubList" aria-labelledby="clubList-t" hidden>
          <h2 id="clubList-t">👥 Clientas del Club</h2>
          <p class="club-list__sub">Así van las clientas del Club BeautyPod.</p>
          <ul id="clubList-ul"></ul>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="../assets/js/components.js" defer></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="../assets/js/club-store.js"></script>
  <script>
  // Los scripts con defer se ejecutan antes de DOMContentLoaded, así que Firebase y ClubStore ya están listos
  document.addEventListener('DOMContentLoaded', function () {
    var S = window.ClubStore, G = S && S.GOAL;
    var token = new URLSearchParams(location.search).get('t');
    var root = document.getElementById('card');
    var listBox = document.getElementById('clubList');
    var rows = [], me = null, hasCard = false;
    var WA = 'https://wa.me/5353719118?text=' + encodeURIComponent('[PW] Hola, necesito ayuda con mi tarjeta del Club BeautyPod');
    // Aviso de problemas de conexión (sin internet, sin VPN, Firebase bloqueado o conexión colgada)
    var WA_NET = 'https://wa.me/5353719118?text=' + encodeURIComponent('[PW] Hola, no puedo ver mi tarjeta de estrellas');
    var NET = '<p class="loyalty-caption">No pudimos cargar tu tarjeta. Revisa tu conexión a internet, prueba usando una VPN o escríbenos por WhatsApp al <a href="' + WA_NET + '" target="_blank" rel="noopener noreferrer">53719118</a>.</p>';
    if (!S) { root.innerHTML = NET; return; }

    var STAR = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L14.8 8.7 L21 9.6 L16.5 14 L17.6 20.3 L12 17.3 L6.4 20.3 L7.5 14 L3 9.6 L9.2 8.7 Z"/></svg>';
    var GIFT = '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M2 5 H22 V10 H2 Z"/><path d="M12 5 V21"/><path d="M12 5 C6 5 5 3 7 2 C10 1 12 5 12 5Z"/><path d="M12 5 C18 5 19 3 17 2 C14 1 12 5 12 5Z"/></svg>';
    var SHIELD = '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 L20 6 V11 C20 16 17 19 12 21 C7 19 4 16 4 11 V6 Z"/><path d="M8 12 L11 15 L16 9"/></svg>';
    var SPARKS = [[8,14,9,0],[88,10,12,.8],[72,38,8,1.6],[16,46,10,2.2],[92,66,9,1.1],[34,84,12,2.8],[62,92,8,.4],[5,78,8,1.9]].map(function (s) {
      return '<i class="spark" style="--x:' + s[0] + '%;--y:' + s[1] + '%;--s:' + s[2] + 'px;--d:' + s[3] + 's;" aria-hidden="true"></i>';
    }).join('');

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function fmt(ms) { return new Date(ms).toLocaleDateString('es-CU', { day: 'numeric', month: 'long', year: 'numeric' }); }

    function rewardText(c) {
      if (c.stars >= G && c.reward) {
        return c.reward.expires < Date.now()
          ? ['Recompensa vencida', 'Tu recompensa venció el ' + fmt(c.reward.expires) + '. Escríbenos y lo revisamos juntas.']
          : ['¡Conseguiste tu recompensa!', 'Tu Servicio Preventivo Completo te espera. Vence el ' + fmt(c.reward.expires) + '.'];
      }
      var n = G - c.stars;
      return [c.redeemedAt ? 'Recompensa canjeada ✓' : 'Tu próxima recompensa',
        'Te ' + (n === 1 ? 'falta 1 estrella' : 'faltan ' + n + ' estrellas') + ' para conseguir tu Servicio Preventivo Completo.'];
    }

    // Lista de clientas ordenada por estrellas (el orden lo deja ya publicado el panel de la especialista)
    function renderList() {
      if (!hasCard || !me || rows.length < 2) { listBox.hidden = true; return; }
      document.getElementById('clubList-ul').innerHTML = rows.map(function (r) {
        var mine = r.h === me;
        return '<li' + (mine ? ' class="me"' : '') + '><span>' + esc(r.n) + (mine ? ' (tú)' : '') + (r.r ? ' 🎁' : '') + '</span>' +
          '<span class="club-st" aria-label="' + r.s + ' de ' + G + ' estrellas">' + '★'.repeat(r.s) + '☆'.repeat(Math.max(0, G - r.s)) + '</span></li>';
      }).join('');
      listBox.hidden = false;
    }

    // c = tarjeta (o null); netErr = true si el problema es de conexión y no de enlace incorrecto
    function render(c, netErr) {
      hasCard = !!c; renderList();
      root.style.minHeight = c ? '' : '0'; // si no hay tarjeta, no se deja el hueco reservado
      if (!c) {
        if (netErr) { root.innerHTML = NET; return; }
        root.innerHTML = '<p class="loyalty-caption">No encontramos tu tarjeta. Revisa que el enlace esté completo o <a href="' + WA + '" target="_blank" rel="noopener noreferrer">escríbenos por WhatsApp</a>.</p>' +
          (S.demo ? '<p class="loyalty-caption">Modo demostración: prueba con <a href="?t=blanca-demo">Blanca</a>, <a href="?t=maria-demo">María</a> o <a href="?t=ana-demo">Ana</a>.</p>' : '');
        return;
      }
      var lis = '';
      for (var i = 1; i <= G; i++) lis += '<li class="lc-star' + (i <= c.stars ? ' is-earned' : '') + '" style="--d:' + ((i - 1) * .5) + 's;"><span class="lc-star__dot">' + STAR + '</span>' + i + '</li>';
      var r = rewardText(c);
      root.innerHTML = '<div class="loyalty-card">' + SPARKS +
        '<div class="loyalty-card__head"><p class="loyalty-card__brand">BeautyPod<span class="loyalty-card__sub">Rewards · Club de fidelidad</span></p><span class="loyalty-card__shield" aria-hidden="true">' + SHIELD + '</span></div>' +
        '<span class="loyalty-card__eyebrow">Tarjeta de ' + esc(c.name) + '</span>' +
        '<h2 class="loyalty-card__title">Cada visita te acerca a tu recompensa.</h2>' +
        '<ol class="lc-stars" aria-label="Estrellas acumuladas: ' + c.stars + ' de ' + G + '">' + lis + '</ol>' +
        '<div class="lc-progress"><div class="lc-progress__row"><span>Progreso del ciclo</span><strong>' + c.stars + '/' + G + '</strong></div>' +
        '<div class="lc-progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="' + G + '" aria-valuenow="' + c.stars + '" aria-label="Progreso del ciclo"><div class="lc-progress__fill" style="width:' + (c.stars / G * 100) + '%"></div></div></div>' +
        '<div class="lc-reward"><span class="lc-reward__icon" aria-hidden="true">' + GIFT + '</span><div><h3>' + r[0] + '</h3><p>' + r[1] + '</p></div></div></div>' +
        '<p class="loyalty-caption">Las estrellas se suman al completar y pagar tu servicio.</p>';
    }

    if (token) {
      // Si la conexión se queda colgada 10 s sin respuesta, se avisa (y si luego llega, la tarjeta se carga sola)
      var got = false;
      setTimeout(function () { if (!got) render(null, true); }, 10000);
      S.watchClient(token, function (c, e) { got = true; render(c, e); });
      if (S.watchLeague && S.myId) {
        S.myId(token).then(function (h) { me = h; renderList(); });
        S.watchLeague(function (r) { rows = r || []; renderList(); });
      }
    } else render(null, false);
  });
  </script>
</body>
</html>
