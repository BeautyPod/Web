<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de presentación | Linet Rodríguez Vega</title>
<meta name="description" content="Tarjeta de presentación digital de Linet Rodríguez Vega: contacto por WhatsApp, Facebook, teléfono y correo.">
<meta name="robots" content="index, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/css/styles.css">

<style>
  body {
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 24px;
    background: #272727;
  }

  .digital-card {
    max-width: 360px;
    margin: 0 auto;
    padding: 32px 24px;
    border-radius: 24px;
    background: linear-gradient(160deg, #1b3a63, #0f2440);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
    text-align: center;
    color: #fff;
  }

  .digital-card__avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    margin: 0 auto 16px;
    display: block;
  }

  .digital-card__eyebrow {
    display: block;
    font-size: .85em;
    letter-spacing: .04em;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 4px;
  }

  .digital-card__name {
    font-size: 1.5em;
    margin: 0 0 10px;
  }

  .digital-card__bio {
    font-size: .95em;
    line-height: 1.5;
    opacity: .9;
    margin: 0 0 24px;
  }

  .digital-card__buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .digital-card__btn {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: .95em;
  }

  .digital-card__btn svg {
    flex-shrink: 0;
  }

  .digital-card__btn--whatsapp {
    background: #25b26a;
  }

  .digital-card__btn--facebook {
    background: #1877f2;
  }

  .digital-card__btn--phone {
    background: #2b2f36;
  }

  .digital-card__btn--email {
    background: #8c2340;
  }

  .digital-card__qr {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    background: #fff;
    padding: 8px;
    display: block;
    margin: 0 auto;
  }

  .digital-card__qr-label {
    font-size: .8em;
    opacity: .75;
    margin-top: 8px;
  }

  .digital-card__badge {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, .15);
  }

  .digital-card__badge a {
    color: #fff;
    opacity: .8;
    font-size: .75em;
    text-decoration: none;
    line-height: 1.4;
  }

  .digital-card__badge a:hover,
  .digital-card__badge a:focus-visible {
    opacity: 1;
    text-decoration: underline;
  }
</style>
</head>
